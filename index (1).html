body {
  font-family: sans-serif;
  line-height: 1.5;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1, h2 {
  color: green;
}

img {
  width: 100%;
  border-radius: 10px;
}

/* Requirement: Center at least one image */
.centered-image {
  display: block;
  margin-left: auto;
  margin-right: auto;
  width: 60%;
}
